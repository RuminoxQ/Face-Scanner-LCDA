<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04210F">
<title>Face Scan Launch Experience</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:'Sora';font-weight:600;font-display:swap;src:url(fonts/sora-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Sora';font-weight:700;font-display:swap;src:url(fonts/sora-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Sora';font-weight:800;font-display:swap;src:url(fonts/sora-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:400;font-display:swap;src:url(fonts/dm-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:500;font-display:swap;src:url(fonts/dm-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:700;font-display:swap;src:url(fonts/dm-sans-latin-700-normal.woff2) format('woff2')}

:root{--accent:#4ADE80}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04210F;overflow:hidden}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit}

@keyframes dcScan{0%{top:2%}50%{top:96%}100%{top:2%}}
@keyframes dcPulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFlash{0%,74%{opacity:0}94%{opacity:1}100%{opacity:1}}
@keyframes dcRise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes dcRingOut{0%{transform:scale(1);opacity:.65}100%{transform:scale(1.4);opacity:0}}
@keyframes dcFall{0%{transform:translateY(-14vh) rotate(0deg)}100%{transform:translateY(112vh) rotate(620deg)}}
@keyframes dcShock{0%{transform:translate(-50%,-50%) scale(.2);opacity:.9}100%{transform:translate(-50%,-50%) scale(10);opacity:0}}
@keyframes dcFloat{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}50%{transform:translate(16px,-18vh)}80%{opacity:.7}100%{transform:translate(-12px,-40vh);opacity:0}}
@keyframes dcRiseLeaf{0%{transform:translateY(0) rotate(0deg);opacity:0}15%{opacity:1}100%{transform:translateY(-72vh) rotate(260deg);opacity:0}}
@keyframes dcRays{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(0deg)}60%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(40deg)}}
@keyframes dcDraw{to{stroke-dashoffset:0}}

#app{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;background:#04210F}
.abs{position:absolute;top:0;left:0;width:100%;height:100%}
.glow{position:absolute;border-radius:50%}
.g1{left:-12%;top:-20%;width:60%;height:90%;background:radial-gradient(closest-side,rgba(34,197,94,.28),transparent)}
.g2{right:-14%;bottom:-30%;width:70%;height:100%;background:radial-gradient(closest-side,rgba(74,222,128,.2),transparent)}
.skyline{position:absolute;left:50%;bottom:7vh;transform:translateX(-50%);width:min(96vw,150vh);opacity:.85;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
[data-stage=energy] .skyline,[data-stage=reveal] .skyline{display:none}
.forest{position:absolute;left:0;right:0;bottom:0;width:100%;height:34vh}
.firefly{position:absolute;border-radius:50%;background:#BEF264;box-shadow:0 0 12px 4px rgba(190,242,100,.55);opacity:0;animation:dcFloat 10s ease-in-out infinite both}

/* ---------- scanner scene ---------- */
#scene{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:1vh 4vw 26vh}
.scanner{--s:min(60vh,90vw,640px);position:relative;width:var(--s);height:var(--s)}
.pulse{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;border:2px solid rgba(134,239,172,.6);animation:dcRingOut 3.2s ease-out infinite;display:none}
.pulse.p2{animation-delay:1.6s}
[data-stage=idle] .pulse,[data-stage=starting] .pulse,[data-stage=position] .pulse{display:block}
.disc{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#021A0C;box-shadow:0 0 0 6px rgba(255,255,255,.12);transform:translateZ(0);-webkit-mask-image:-webkit-radial-gradient(white,black)}
#video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;transition:opacity .25s}
[data-stage=position] #video,[data-stage=countdown] #video,[data-stage=scanning] #video{opacity:1}
[data-demo="1"] #video{opacity:0!important}
#dots{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0}
[data-stage=granted] #dots{opacity:1}
.silhouette{position:absolute;top:0;left:0;width:100%;height:100%;display:none}
[data-demo="1"][data-stage=position] .silhouette,[data-demo="1"][data-stage=countdown] .silhouette,[data-demo="1"][data-stage=scanning] .silhouette{display:block}
.scanline{position:absolute;left:0;right:0;height:3px;background:#BBF7D0;box-shadow:0 0 24px 8px rgba(134,239,172,.55);animation:dcScan 1.6s ease-in-out infinite;display:none}
[data-stage=scanning] .scanline{display:block}
.faceguide{position:absolute;left:50%;top:50%;height:66%;transform:translate(-50%,-50%);display:none;overflow:visible}
.faceguide ellipse{fill:none;stroke:rgba(255,255,255,.7);stroke-width:1.2;stroke-dasharray:4 3;transition:stroke .2s}
.faceguide.ok ellipse{stroke:var(--accent);stroke-width:2;stroke-dasharray:none}
[data-stage=position] .faceguide,[data-stage=countdown] .faceguide{display:block}
.count{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(4,33,15,.5);display:none;align-items:center;justify-content:center}
[data-stage=countdown] .count{display:flex}
.count span{font-family:'Sora',sans-serif;font-weight:800;line-height:1;font-size:calc(var(--s)*.5);color:#fff}
.count span.last{color:#BEF264}
.count span.pop{animation:dcPop .55s ease-out both}

.ring{position:absolute;left:-5%;top:-5%;width:110%;height:110%;overflow:visible;transform:rotate(-90deg);opacity:0;filter:drop-shadow(0 0 7px var(--accent));transition:opacity .25s}
[data-stage=scanning] .ring,[data-stage=granted] .ring{opacity:1}
.ring .fill{stroke:var(--accent);transition:stroke-dashoffset .12s linear}
[data-stage=granted] .ring{filter:drop-shadow(0 0 18px var(--accent))}
[data-stage=granted] .ring .fill{stroke:#fff}
.orbit{position:absolute;left:-5%;top:-5%;width:110%;height:110%;overflow:visible;display:none;animation:dcSpin 1.6s linear infinite}
[data-stage=position] .orbit{display:block}
.check{position:absolute;right:2%;bottom:8%;width:20%;height:20%;border-radius:50%;background:var(--accent);display:none;align-items:center;justify-content:center;box-shadow:0 0 0 6px #04210F}
[data-stage=granted] .check{display:flex;animation:dcPop .55s ease-out both}
.check svg{width:56%;height:56%}
.denied{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;background:rgba(4,33,15,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12%;text-align:center}
[data-stage=denied] .denied{display:flex}
.denied h2{margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(18px,2.4vw,30px)}
.denied p{margin:0;font-size:clamp(13px,1.3vw,17px);line-height:1.45;color:#BBF7D0;max-width:360px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{cursor:pointer;min-height:48px;padding:0 22px;border-radius:999px;font-size:16px;font-weight:700;border:2px solid #fff;background:transparent;color:#fff;transition:filter .15s,transform .15s}
.btn.solid{background:#fff;color:#14532D;border-color:#fff}
.btn:active{transform:scale(.97)}
.btn:focus-visible,#fs:focus-visible,#tap:focus-visible{outline:3px solid #BEF264;outline-offset:4px}
#tap{position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:50%;background:transparent;cursor:pointer;display:none}
[data-stage=idle] #tap{display:block}

/* ---------- energy transition ---------- */
.layer{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;display:none}
[data-stage=energy] #energy,[data-stage=reveal] #reveal{display:block}
[data-stage=energy] #scene,[data-stage=reveal] #scene,[data-stage=energy] #fireflies,[data-stage=reveal] #fireflies{display:none}
#energy{background:#04210F}
.vine{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dcDraw 1.9s ease-out forwards}
.leaf{position:absolute;border-radius:0 100% 0 100%;opacity:0}
.rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;opacity:0;background:repeating-conic-gradient(rgba(255,255,255,.24) 0deg 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(closest-side,#000,transparent);mask-image:radial-gradient(closest-side,#000,transparent);animation:dcRays 2.9s ease-in forwards}
.shock{position:absolute;left:50%;top:50%;width:20vmin;height:20vmin;border-radius:50%;border:4px solid #fff;opacity:0;animation:dcShock 1.5s 1.8s ease-out forwards}
.flash{position:absolute;top:0;left:0;width:100%;height:100%;background:#fff;opacity:0;animation:dcFlash 2.9s ease-in forwards}

/* ---------- launch page ---------- */
#reveal{background:#fff;color:#04210F}
.sun{position:absolute;left:50%;top:44%;width:90vmin;height:90vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(34,197,94,.16),transparent)}
.center{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4vh;padding:24px;text-align:center}
.shield{position:relative;width:min(26vh,46vw);height:calc(min(26vh,46vw)*1.15);animation:dcPop .55s ease-out both}
.shield svg{position:absolute;overflow:visible}
.shield .base{top:0;left:0;width:100%;height:100%}
.shield .r1{left:-26%;top:-16%;width:152%;height:132%;animation:dcSpin 5s linear infinite}
.shield .r2{left:-15%;top:-8%;width:130%;height:116%;animation:dcSpin 8s linear infinite reverse}
.shield .name{position:absolute;left:0;right:0;top:17%;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(14px,2.6vh,22px);letter-spacing:.08em;color:#fff}
.shield .logo{position:absolute;left:0;right:0;top:55%;font-size:clamp(11px,1.8vh,15px);font-weight:700;letter-spacing:.14em;color:#86EFAC}
.rise{animation:dcRise .6s ease-out both}
.eyebrow{font-size:15px;font-weight:700;letter-spacing:.2em;color:#15803D}
.title{margin:0;font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(36px,6.4vw,96px);line-height:1.04;letter-spacing:-.025em}
.note{font-size:clamp(18px,1.8vw,26px);color:#166534}
.bar{display:flex;align-items:center;gap:14px;width:min(86vw,480px)}
.bar .track{flex:1 1 auto;height:12px;border-radius:999px;background:#DCFCE7;overflow:hidden}
.bar .fillbar{height:100%;width:0;border-radius:999px;background:#16A34A}
.bar .pct{min-width:52px;text-align:right;font-size:16px;font-weight:700;color:#14532D;font-variant-numeric:tabular-nums}
#again{display:none;border-color:#14532D;color:#14532D;background:#fff;min-height:52px;padding:0 28px;font-size:17px}

/* ---------- fullscreen button ---------- */
#fs{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:50;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(4,33,15,.6);color:#fff;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;opacity:.75;transition:opacity .15s}
#fs:hover,#fs:active{opacity:1}
#fs svg{width:22px;height:22px}
#fs .ico-out{display:none}
#fs.on .ico-in{display:none}
#fs.on .ico-out{display:block}

@media (prefers-reduced-motion: reduce){.pulse,.scanline,.orbit,.firefly,.shield .r1,.shield .r2{animation:none}}
</style>
</head>
<body>
<div id="app" data-stage="idle" data-demo="0">

<div class="glow g1"></div>
<div class="glow g2"></div>
<svg class="abs" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g id="contours" fill="none" stroke="#4ADE80" stroke-opacity=".2" stroke-width="1.2"></g></svg>
<div id="fireflies"></div>
<img class="skyline" src="skyline.png" alt="">
<svg class="forest" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<path class="tb" fill="#0A3719"/>
<path d="M0 300V236C200 196 380 236 560 210C760 180 980 240 1200 204C1380 178 1500 208 1600 194V300Z" fill="#093017"/>
<path class="tf" fill="#052712"/>

</svg>

<main id="scene">
<div class="scanner">
<div class="pulse"></div>
<div class="pulse p2"></div>

<div class="disc">
<video id="video" playsinline muted autoplay></video>
<svg class="silhouette" viewBox="0 0 400 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><circle cx="200" cy="170" r="78" fill="#14532D"/><path d="M40 420c0-90 70-140 160-140s160 50 160 140z" fill="#14532D"/></svg>
<canvas id="dots" width="440" height="440"></canvas>
<div class="scanline"></div>
<svg id="faceguide" class="faceguide" viewBox="0 0 100 130" aria-hidden="true"><ellipse cx="50" cy="65" rx="46" ry="62"/></svg>
<div class="count"><span id="countNum">3</span></div>
</div>

<svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.6"/>
<circle id="ringFill" class="fill" cx="50" cy="50" r="48" fill="none" stroke-width="2.4" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
</svg>
<svg class="orbit" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="none" stroke="#4ADE80" stroke-width="1.4" stroke-dasharray="26 275" stroke-linecap="round"/></svg>

<div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#04210F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>

<div class="denied">
<h2>Camera unavailable</h2>

<div class="row">
<button class="btn solid" id="retry">Try again</button>

</div>
</div>

<button id="tap" aria-label="Start scan"></button>
</div>
</main>

<section id="energy" class="layer" aria-hidden="true">
<div class="glow" style="left:-10%;top:10%;width:60%;height:80%;background:radial-gradient(closest-side,rgba(34,197,94,.4),transparent)"></div>
<div class="glow" style="right:-10%;top:0;width:60%;height:80%;background:radial-gradient(closest-side,rgba(74,222,128,.32),transparent)"></div>
<svg class="forest" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice">
<path class="tb" fill="#0A3719"/>
<path d="M0 300V236C200 196 380 236 560 210C760 180 980 240 1200 204C1380 178 1500 208 1600 194V300Z" fill="#093017"/>
<path class="tf" fill="#052712"/>
<path d="M0 300V262C240 236 460 268 700 250C940 232 1200 270 1600 246V300Z" fill="#031A0A"/>
</svg>
<svg class="abs" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" style="filter:drop-shadow(0 0 8px #4ADE80)">
<path class="vine" pathLength="1" stroke="#22C55E" stroke-width="7" style="animation-delay:.1s" d="M200 920C260 760 120 640 240 520C340 420 240 300 360 180C420 120 520 100 560 40"/>
<path class="vine" pathLength="1" stroke="#4ADE80" stroke-width="6" style="animation-delay:.3s" d="M520 920C600 800 500 700 620 600C720 520 640 400 760 320C840 260 800 160 900 100"/>
<path class="vine" pathLength="1" stroke="#22C55E" stroke-width="7" style="animation-delay:.5s" d="M800 920C740 820 860 740 800 640C740 540 880 480 820 380C780 300 880 240 840 160"/>
<path class="vine" pathLength="1" stroke="#4ADE80" stroke-width="6" style="animation-delay:.7s" d="M1100 920C1180 800 1040 700 1160 600C1260 520 1180 420 1300 340C1380 280 1340 180 1440 120"/>
<path class="vine" pathLength="1" stroke="#22C55E" stroke-width="7" style="animation-delay:.9s" d="M1420 920C1360 780 1500 700 1440 580C1400 500 1520 440 1480 340C1450 270 1540 220 1520 140"/>
<path class="vine" pathLength="1" stroke="#fff" stroke-width="2.5" style="animation-delay:.25s" d="M200 920C260 760 120 640 240 520C340 420 240 300 360 180C420 120 520 100 560 40"/>

<section id="reveal" class="layer">
<div class="sun"></div>
<svg class="abs" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g id="contoursLight" fill="none" stroke="#16A34A" stroke-opacity=".16" stroke-width="1.2"></g></svg>
<svg class="forest" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<path class="tb" fill="#BBF7D0"/>
<path d="M0 300V236C200 196 380 236 560 210C760 180 980 240 1200 204C1380 178 1500 208 1600 194V300Z" fill="#DCFCE7"/>
<path class="tf" fill="#4ADE80"/>
<path d="M0 300V262C240 236 460 268 700 250C940 232 1200 270 1600 246V300Z" fill="#22C55E"/>
</svg>
<div id="fallLeaves"></div>
<div class="center">
<div class="shield">
<svg class="r1" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-dasharray="120 182" stroke-linecap="round"/></svg>
<svg class="r2" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="none" stroke="#14532D" stroke-width="1.2" stroke-dasharray="70 232" stroke-linecap="round"/></svg>

</div>

</div>

</button>

</div>

<script src="vendor/face-api.js"></script>
<script>
(function () {
  'use strict';

  /* ---- settings you can tune ---- */
  var CFG = {
    holdMs: 700,        // face must stay in frame this long before the countdown starts
    countFrom: 3,       // countdown length in seconds
    scanMs: 3000,       // scan duration
    lostGraceMs: 600,   // countdown cancels if the face is gone this long
    lostResetMs: 2500,  // scan restarts from the top if the face is gone this long
    detectEveryMs: 100, // how often to look for a face
    minFace: 0.28,      // face size limits, as a share of the circle
    maxFace: 0.72
  };

  var $ = function (id) { return document.getElementById(id); };
  var app = $('app'), video = $('video'), dots = $('dots');
  var timers = {};
  var stage = 'idle', demo = false, stream = null;
  var progress = 0;
  var faceOK = false, okSince = 0, lostSince = 0, detecting = false, modelPromise = null, detectOpts = null;

  /* ---------- helpers ---------- */
  function rnd(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function setStage(s) { stage = s; app.setAttribute('data-stage', s); }
  function clearT(k) { if (timers[k]) { clearInterval(timers[k]); clearTimeout(timers[k]); timers[k] = null; } }
  function clearAll() { Object.keys(timers).forEach(clearT); }
  function el(tag, cls, style, ns) {
    var e = ns ? document.createElementNS(ns, tag) : document.createElement(tag);
    if (cls) e.setAttribute('class', cls);
    if (style) e.setAttribute('style', style);
    return e;
  }

  /* ---------- scenery ---------- */
  function buildTrees(count, base, minS, maxS, seed) {
    var d = '';
    for (var i = 0; i < count; i++) {
      var x = (i + 0.5) * (1600 / count) + (rnd(seed + i) - 0.5) * 40;
      var s = minS + rnd(seed + i * 3) * (maxS - minS);
      var b = base + (rnd(seed + i * 7) - 0.5) * 20;
      var p = function (dx, dy) { return (x + dx * s).toFixed(1) + ' ' + (b - dy * s).toFixed(1); };
      d += 'M' + p(-24, 0) + 'L' + p(-9, 60) + 'L' + p(-17, 60) + 'L' + p(-6, 105) + 'L' + p(-12, 105) + 'L' + p(0, 150) +
           'L' + p(12, 105) + 'L' + p(6, 105) + 'L' + p(17, 60) + 'L' + p(9, 60) + 'L' + p(24, 0) + 'Z';
    }
    return d;
  }
  var back = buildTrees(30, 250, 0.7, 1.0, 11), front = buildTrees(16, 300, 1.0, 1.6, 71);
  [].forEach.call(document.querySelectorAll('.tb'), function (p) { p.setAttribute('d', back); });
  [].forEach.call(document.querySelectorAll('.tf'), function (p) { p.setAttribute('d', front); });

  var SVGNS = 'http://www.w3.org/2000/svg';
  var BLOB = 'M100 0C112 38 76 92 22 104C-34 116 -96 84 -102 24C-108 -40 -62 -94 -2 -102C58 -108 92 -52 100 0Z';
  function contours(g, sets) {
    sets.forEach(function (c) {
      var p = el('path', null, null, SVGNS);
      p.setAttribute('d', BLOB);
      p.setAttribute('vector-effect', 'non-scaling-stroke');
      p.setAttribute('transform', 'translate(' + c[0] + ' ' + c[1] + ') scale(' + c[2] + ') rotate(' + c[3] + ')');
      g.appendChild(p);
    });
  }
  contours($('contours'), [
    [1290, 300, .45, 10], [1290, 300, .8, 18], [1290, 300, 1.15, 26], [1290, 300, 1.55, 34], [1290, 300, 2, 42], [1290, 300, 2.5, 50],
    [230, 640, .5, -12], [230, 640, .9, -4], [230, 640, 1.3, 4], [230, 640, 1.75, 12], [230, 640, 2.25, 20]
  ]);
  contours($('contoursLight'), [
    [1290, 300, .6, 10], [1290, 300, 1.1, 22], [1290, 300, 1.65, 34], [1290, 300, 2.3, 46],
    [260, 520, .6, -12], [260, 520, 1.1, 0], [260, 520, 1.65, 12], [260, 520, 2.3, 24]
  ]);

  (function fireflies() {
    var box = $('fireflies');
    for (var i = 0; i < 16; i++) {
      var s = 4 + rnd(i + 80) * 4;
      box.appendChild(el('div', 'firefly',
        'left:' + (rnd(i + 5) * 96 + 2).toFixed(1) + '%;bottom:' + (rnd(i + 45) * 40).toFixed(1) + '%;width:' + s.toFixed(0) + 'px;height:' + s.toFixed(0) + 'px;' +
        'animation-duration:' + (7 + rnd(i + 125) * 6).toFixed(2) + 's;animation-delay:' + (rnd(i + 165) * 8).toFixed(2) + 's'));
    }
  })();

  function leaves(box, n, mode) {
    box.innerHTML = '';
    var colors = mode === 'rise' ? ['#22C55E', '#4ADE80', '#86EFAC', '#BEF264'] : ['#16A34A', '#22C55E', '#86EFAC', '#14532D', '#BEF264'];
    for (var i = 0; i < n; i++) {
      var size = mode === 'rise' ? 16 + rnd(i + 80) * 18 : 12 + rnd(i + 7) * 14;
      var st = 'width:' + size.toFixed(0) + 'px;height:' + (size * 0.9).toFixed(0) + 'px;background:' + colors[i % colors.length] + ';';
      if (mode === 'rise') {
        st += 'left:' + (rnd(i + 21) * 96 + 2).toFixed(1) + '%;bottom:' + (rnd(i + 61) * 10).toFixed(1) + '%;animation:dcRiseLeaf ' +
              (2.2 + rnd(i + 141) * 1).toFixed(2) + 's ' + (rnd(i + 181) * 1.4).toFixed(2) + 's ease-out both';
      } else {
        st += 'top:0;left:' + (rnd(i) * 100).toFixed(1) + '%;opacity:1;animation:dcFall ' +
              (3 + rnd(i + 99) * 2.4).toFixed(2) + 's ' + (rnd(i + 50) * 1.8).toFixed(2) + 's ease-in both';
      }
      box.appendChild(el('div', 'leaf', st));
    }
  }

  /* ---------- face detection ---------- */
  function ensureModel() {
    if (modelPromise) return modelPromise;
    modelPromise = (async function () {
      if (!window.faceapi) throw new Error('detector missing');
      try { await faceapi.tf.setBackend('webgl'); } catch (e) {}
      await faceapi.tf.ready();
      await faceapi.nets.tinyFaceDetector.loadFromUri('vendor/model');
      detectOpts = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.45 });
    })();
    modelPromise.catch(function () { modelPromise = null; });
    return modelPromise;
  }

  // Is the face fully inside the circle, centred, and a sensible size?
  function inFrame(box) {
    if (!box) return false;
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return false;
    var side = Math.min(vw, vh), sx = (vw - side) / 2, sy = (vh - side) / 2;
    var x1 = (box.x - sx) / side, y1 = (box.y - sy) / side;
    var x2 = (box.x + box.width - sx) / side, y2 = (box.y + box.height - sy) / side;
    var cx = (x1 + x2) / 2, cy = (y1 + y2) / 2, size = Math.max(x2 - x1, y2 - y1);
    var corners = [[x1, y1], [x2, y1], [x1, y2], [x2, y2]];
    var inside = corners.every(function (c) { return Math.hypot(c[0] - 0.5, c[1] - 0.5) <= 0.47; });
    return inside && size >= CFG.minFace && size <= CFG.maxFace && Math.hypot(cx - 0.5, cy - 0.5) <= 0.2;
  }

  async function detectOnce() {
    if (detecting || !detectOpts || !video.videoWidth) return;
    if (stage !== 'position' && stage !== 'countdown' && stage !== 'scanning') return;
    detecting = true;
    try {
      var r = await faceapi.detectSingleFace(video, detectOpts);
      onFace(inFrame(r ? r.box : null), Date.now());
    } catch (e) {
      onFace(false, Date.now());
    } finally {
      detecting = false;
    }
  }

  function onFace(ok, now) {
    faceOK = ok;
    $('faceguide').classList.toggle('ok', ok);
    if (ok) { lostSince = 0; if (!okSince) okSince = now; }
    else { okSince = 0; if (!lostSince) lostSince = now; }

    if (stage === 'position' && ok && now - okSince >= CFG.holdMs) startCountdown();
    else if (stage === 'countdown' && !ok && now - lostSince >= CFG.lostGraceMs) beginPosition();
    else if (stage === 'scanning' && !ok && now - lostSince >= CFG.lostResetMs) beginPosition();
  }

  /* ---------- camera ---------- */
  async function ensureStream() {
    if (stream && stream.getTracks().some(function (t) { return t.readyState === 'live'; })) {
      if (video.srcObject !== stream) video.srcObject = stream;
    } else {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera api');
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
      video.srcObject = stream;
    }
    video.muted = true; video.setAttribute('playsinline', '');
    try { await video.play(); } catch (e) {}
  }
  function stopStream() {
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); }
    stream = null; video.srcObject = null;
  }

  /* ---------- flow ---------- */
  function deny(msg) { $('deniedNote').textContent = msg; setStage('denied'); }

  async function start() {
    if (stage !== 'idle' && stage !== 'denied') return;
    demo = false; app.setAttribute('data-demo', '0');
    setStage('starting');
    keepAwake();
    var s = ensureStream();          // called straight from the tap so iPad Safari allows it
    var m = ensureModel();
    try { await s; } catch (e) { deny('Camera access was blocked or no camera was found. Allow camera access in your browser settings, then try again.'); return; }
    try { await m; } catch (e) { deny('Face detection could not load. Check the connection, reload the page and try again.'); return; }
    beginPosition();
  }

  function startDemo() {
    clearAll(); stopStream();
    demo = true; app.setAttribute('data-demo', '1');
    beginPosition();
  }

  function beginPosition() {
    clearT('count'); clearT('scan'); clearT('detect'); clearT('demoPos');
    progress = 0; setRing(0);
    okSince = 0; lostSince = Date.now(); faceOK = false;
    $('faceguide').classList.remove('ok');
    setStage('position');
    if (demo) {
      timers.demoPos = setTimeout(function () { $('faceguide').classList.add('ok'); faceOK = true; timers.demoPos = setTimeout(startCountdown, 700); }, 1800);
    } else {
      timers.detect = setInterval(detectOnce, CFG.detectEveryMs);
    }
  }

  function showCount(n) {
    var c = $('countNum');
    c.textContent = n;
    c.className = (n === 1 ? 'last ' : '') + 'pop';
    void c.offsetWidth;            // restart the pop animation
  }

  function startCountdown() {
    clearT('count'); clearT('demoPos');
    var n = CFG.countFrom;
    setStage('countdown');
    showCount(n);
    timers.count = setInterval(function () {
      n -= 1;
      if (n <= 0) { clearT('count'); beginScan(); } else { showCount(n); }
    }, 1000);
  }

  function setRing(p) { $('ringFill').style.strokeDashoffset = String(100 - p); }

  function beginScan() {
    progress = 0; setRing(0);
    setStage('scanning');
    var step = 100 / (CFG.scanMs / 60);
    timers.scan = setInterval(function () {
      var present = demo || faceOK || (Date.now() - lostSince < CFG.lostGraceMs);
      if (!present) return;                       // pause while the face is out of frame
      progress = Math.min(100, progress + step);
      setRing(progress);
      if (progress >= 100) granted();
    }, 60);
  }

  function granted() {
    clearT('scan'); clearT('detect');
    setStage('granted');
    drawDots();
    timers.dots = setInterval(drawDots, 90);
    timers.next = setTimeout(startEnergy, 2600);
  }

  function startEnergy() {
    clearT('dots');
    leaves($('riseLeaves'), 26, 'rise');
    setStage('energy');
    timers.next = setTimeout(startReveal, 3000);
  }

  function startReveal() {
    leaves($('fallLeaves'), 40, 'fall');
    $('again').style.display = 'none';
    $('launchNote').textContent = 'Preparing your experience…';
    var p = 0;
    $('launchFill').style.width = '0%'; $('launchPct').textContent = '0';
    setStage('reveal');
    timers.launch = setInterval(function () {
      p = Math.min(100, p + 0.9);
      $('launchFill').style.width = p + '%';
      $('launchPct').textContent = String(Math.round(p));
      if (p >= 100) {
        clearT('launch');
        $('launchNote').textContent = 'Ready. Welcome aboard.';
        $('again').style.display = 'inline-block';
      }
    }, 50);
  }

  function reset() {
    clearAll();
    var c = dots.getContext('2d'); c.clearRect(0, 0, dots.width, dots.height);
    progress = 0; setRing(0); demo = false; app.setAttribute('data-demo', '0');
    setStage('idle');
  }

  /* ---------- dot-matrix portrait ---------- */
  var off = document.createElement('canvas'); off.width = off.height = 44;
  function drawDots() {
    var G = 44, ctx = dots.getContext('2d'), o = off.getContext('2d', { willReadFrequently: true });
    if (demo) {
      o.fillStyle = '#1a1a1a'; o.fillRect(0, 0, G, G);
      o.fillStyle = '#d8d8d8'; o.beginPath(); o.ellipse(G / 2, G * .42, G * .2, G * .26, 0, 0, Math.PI * 2); o.fill();
      o.beginPath(); o.ellipse(G / 2, G * 1.02, G * .4, G * .3, 0, 0, Math.PI * 2); o.fill();
      o.fillStyle = '#333';
      o.beginPath(); o.arc(G * .42, G * .4, 1.4, 0, Math.PI * 2); o.fill();
      o.beginPath(); o.arc(G * .58, G * .4, 1.4, 0, Math.PI * 2); o.fill();
    } else if (video.videoWidth) {
      var side = Math.min(video.videoWidth, video.videoHeight);
      o.save(); o.translate(G, 0); o.scale(-1, 1);
      o.drawImage(video, (video.videoWidth - side) / 2, (video.videoHeight - side) / 2, side, side, 0, 0, G, G);
      o.restore();
    } else { return; }
    var data = o.getImageData(0, 0, G, G).data, W = dots.width, cell = W / G;
    ctx.clearRect(0, 0, W, W);
    for (var y = 0; y < G; y++) {
      for (var x = 0; x < G; x++) {
        var dx = x + .5 - G / 2, dy = y + .5 - G / 2;
        if (dx * dx + dy * dy > (G / 2) * (G / 2)) continue;
        var i = (y * G + x) * 4;
        var luma = (.3 * data[i] + .59 * data[i + 1] + .11 * data[i + 2]) / 255;
        var l = Math.min(1, Math.max(0, (luma - .12) * 1.6));
        ctx.fillStyle = l > .66 ? '#FFFFFF' : (l > .36 ? '#86EFAC' : '#22C55E');
        ctx.beginPath();
        ctx.arc((x + .5) * cell, (y + .5) * cell, cell * .5 * (.2 + .8 * l), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  /* ---------- full screen ---------- */
  var fsBtn = $('fs'), root = document.documentElement;
  var fsEnabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  function inFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  if (fsEnabled && (root.requestFullscreen || root.webkitRequestFullscreen)) {
    fsBtn.style.display = 'flex';
    fsBtn.addEventListener('click', function () {
      if (inFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
      else { (root.requestFullscreen || root.webkitRequestFullscreen).call(root); }
    });
    var sync = function () { fsBtn.classList.toggle('on', inFs()); };
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
  }

  /* ---------- keep the screen awake ---------- */
  var wake = null;
  function keepAwake() {
    try { if (navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(function (w) { wake = w; w.addEventListener('release', function () { wake = null; }); }).catch(function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && stage !== 'idle') keepAwake(); });
  window.addEventListener('pagehide', stopStream);

  /* ---------- wire up ---------- */
  $('tap').addEventListener('click', start);
  $('retry').addEventListener('click', start);
  $('demoBtn').addEventListener('click', startDemo);
  $('again').addEventListener('click', reset);

  // start loading the detector right away so the first scan is quick
  ensureModel().catch(function () {});
})();
</script>
</body>
</html>
