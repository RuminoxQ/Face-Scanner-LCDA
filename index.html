<title>Face Scan Launch Experience</title>

<style>
@font-face{font-family:'Sora';font-weight:600;font-display:swap;src:url(fonts/sora-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Sora';font-weight:700;font-display:swap;src:url(fonts/sora-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Sora';font-weight:800;font-display:swap;src:url(fonts/sora-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:400;font-display:swap;src:url(fonts/dm-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:500;font-display:swap;src:url(fonts/dm-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:700;font-display:swap;src:url(fonts/dm-sans-latin-700-normal.woff2) format('woff2')}

:root{--accent:#16A34A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#ECFCCB;overflow:hidden}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:#14532D;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit}

@keyframes dcScan{0%{top:2%}50%{top:96%}100%{top:2%}}
@keyframes dcPulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFlash{0%,74%{opacity:0}94%{opacity:1}100%{opacity:1}}
@keyframes dcRise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes dcRingOut{0%{transform:scale(1);opacity:.65}100%{transform:scale(1.4);opacity:0}}
@keyframes dcFall{0%{transform:translateY(-14vh) rotate(0deg)}100%{transform:translateY(112vh) rotate(620deg)}}
@keyframes dcShock{0%{transform:translate(-50%,-50%) scale(.2);opacity:.9}100%{transform:translate(-50%,-50%) scale(10);opacity:0}}
@keyframes dcFloat{0%{transform:translate(0,0);opacity:0}20%{opacity:.9}50%{transform:translate(16px,-18vh)}80%{opacity:.7}100%{transform:translate(-12px,-40vh);opacity:0}}
@keyframes dcRiseLeaf{0%{transform:translateY(0) rotate(0deg);opacity:0}15%{opacity:1}100%{transform:translateY(-72vh) rotate(260deg);opacity:0}}
@keyframes dcRays{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(0deg)}60%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(40deg)}}
@keyframes dcDraw{to{stroke-dashoffset:0}}

#app{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;background:#ECFCCB}
.abs{position:absolute;top:0;left:0;width:100%;height:100%}
.glow{position:absolute;border-radius:50%}
.g1{left:-12%;top:-20%;width:60%;height:90%;background:radial-gradient(closest-side,rgba(34,197,94,.28),transparent)}
.g2{right:-14%;bottom:-30%;width:70%;height:100%;background:radial-gradient(closest-side,rgba(74,222,128,.2),transparent)}
.skyline{position:absolute;left:50%;bottom:1.5vh;transform:translateX(-50%);width:min(92vw,130vh);opacity:.95;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}

.scape{position:absolute;left:0;right:0;bottom:7vh;width:100%;height:34vh;pointer-events:none}
.fauna{position:absolute;left:0;right:0;bottom:3.2vh;height:0;pointer-events:none;display:none}
[data-stage=reveal] .fauna{display:block;animation:fIn 1.6s .9s both}
@keyframes fIn{from{opacity:0}to{opacity:.92}}
.animal{position:absolute;left:0;bottom:0;will-change:transform}
.a-deer{display:block;height:15vh;width:auto;overflow:visible}
.walk{animation:bob 1s ease-in-out infinite}
@keyframes goR{from{transform:translateX(-24vw)}to{transform:translateX(124vw)}}
@keyframes goL{from{transform:translateX(124vw)}to{transform:translateX(-24vw)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5vh)}}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:15vh;pointer-events:none}
.skyline,.scape,.hills{transition:opacity .9s ease,visibility 0s}
[data-stage=energy] .skyline,[data-stage=reveal] .skyline,[data-stage=energy] .scape,[data-stage=reveal] .scape,[data-stage=energy] .hills,[data-stage=reveal] .hills{opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s .9s}
.forest{position:absolute;left:0;right:0;bottom:0;width:100%;height:34vh}
.firefly{display:none;position:absolute;border-radius:50%;background:#BEF264;box-shadow:0 0 12px 4px rgba(190,242,100,.55);opacity:0;animation:dcFloat 10s ease-in-out infinite both}

/* ---------- scanner scene ---------- */
#scene{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:0 4vw 13vh}
.scanner{--s:min(64vh,92vw,720px);position:relative;width:var(--s);height:var(--s)}
.disc{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(closest-side,#F6FDF8,#D3F0DD);box-shadow:0 0 0 8px rgba(255,255,255,.75),0 22px 60px rgba(20,83,45,.28);transform:translateZ(0);-webkit-mask-image:-webkit-radial-gradient(white,black)}
#video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;transition:opacity .25s}
[data-stage=position] #video,[data-stage=scanning] #video,[data-stage=granted] #video{opacity:1}
[data-demo="1"] #video{opacity:0!important}
.silhouette{position:absolute;top:0;left:0;width:100%;height:100%;display:none}
[data-demo="1"][data-stage=position] .silhouette,[data-demo="1"][data-stage=scanning] .silhouette,[data-demo="1"][data-stage=granted] .silhouette{display:block}

[data-stage=granted] .disc{background:#052712}
.scanpct{position:absolute;left:0;top:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;color:#fff;font-size:calc(var(--s)*.2);text-shadow:0 2px 24px rgba(0,0,0,.55),0 0 6px rgba(0,0,0,.35);font-variant-numeric:tabular-nums;pointer-events:none;transition:opacity .2s}
.scanpct small{font-size:.5em;margin-left:.08em;font-weight:700}
[data-stage=scanning] .scanpct{display:flex}
.scanner.paused .scanpct{opacity:.45}
.scanner.has .disc{box-shadow:0 0 0 8px rgba(22,163,74,.6),0 22px 60px rgba(20,83,45,.28)}
.check{position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%;background:var(--accent);display:none;align-items:center;justify-content:center;box-shadow:0 0 0 7px #fff,0 12px 40px rgba(20,83,45,.4)}
[data-stage=granted] .check{display:flex;animation:dcPop .55s ease-out both}
.check svg{width:58%;height:58%}
.denied{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;background:rgba(240,253,244,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12%;text-align:center}
[data-stage=denied] .denied{display:flex}
.denied h2{margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(18px,2.4vw,30px)}
.denied p{margin:0;font-size:clamp(13px,1.3vw,17px);line-height:1.45;color:#166534;max-width:360px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{cursor:pointer;min-height:48px;padding:0 22px;border-radius:999px;font-size:16px;font-weight:700;border:2px solid #14532D;background:transparent;color:#14532D;transition:filter .15s,transform .15s}
.btn.solid{background:#14532D;color:#fff;border-color:#14532D}
.btn:active{transform:scale(.97)}
.btn:focus-visible,#fs:focus-visible,#tap:focus-visible{outline:3px solid #16A34A;outline-offset:4px}
#tap{position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:50%;background:transparent;cursor:pointer;display:none}
[data-stage=idle] #tap{display:block}

/* ---------- ribbon transition + launch page ---------- */
.layer{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;display:none}
[data-stage=energy] #silk,[data-stage=reveal] #silk,[data-stage=energy] #energy,[data-stage=reveal] #reveal{display:block}
#scene{transition:opacity .6s ease,transform .9s ease,visibility 0s}
[data-stage=energy] #scene,[data-stage=reveal] #scene{opacity:0;transform:scale(1.07);visibility:hidden;pointer-events:none;transition:opacity .6s ease,transform .9s ease,visibility 0s .9s}
[data-stage=energy] #fireflies,[data-stage=reveal] #fireflies{display:none}
#silk{display:block;background:radial-gradient(55% 70% at 8% 55%,rgba(254,252,232,.95),transparent 70%),radial-gradient(60% 80% at 100% 75%,rgba(110,200,140,.55),transparent 70%),linear-gradient(112deg,#f7fee7 0%,#ecfccb 26%,#dcfce7 52%,#bbf7d0 78%,#9ee0b4 100%)}
@keyframes silkIn{from{opacity:0}to{opacity:1}}
#silk .stripes{position:absolute;left:-20%;top:-20%;width:140%;height:140%;background:repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 46px,rgba(255,255,255,.34) 46px 84px,rgba(22,163,74,.07) 84px 150px,rgba(255,255,255,0) 150px 210px);-webkit-mask-image:radial-gradient(75% 75% at 50% 50%,#000,transparent);mask-image:radial-gradient(75% 75% at 50% 50%,#000,transparent);animation:stripeDrift 14s linear infinite}
@keyframes stripeDrift{from{transform:translateX(0)}to{transform:translateX(210px)}}
#birds{position:absolute;top:0;left:0;width:100%;height:100%;display:block;pointer-events:none}
#ribbons{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
#reveal{color:#14532D}
.center{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;padding:24px 24px 14vh;text-align:center}
.logo{height:min(40vh,62vw);width:auto;filter:drop-shadow(0 0 22px rgba(255,255,255,.9)) drop-shadow(0 6px 18px rgba(20,83,45,.18));animation:logoIn 1.4s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes logoIn{from{opacity:0;transform:scale(.82);filter:blur(14px) drop-shadow(0 0 22px #fff)}to{opacity:1;transform:scale(1)}}
.rise{animation:dcRise .6s ease-out both}
.title{margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(20px,3vw,40px);letter-spacing:.14em;text-transform:uppercase;color:#14532D}
.note{font-size:clamp(15px,1.5vw,22px);color:#166534}
.bar{display:flex;align-items:center;gap:14px;width:min(86vw,480px)}
.bar .track{flex:1 1 auto;height:10px;border-radius:999px;background:rgba(255,255,255,.65);overflow:hidden}
.bar .fillbar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#4ADE80,#15803D)}
.bar .pct{min-width:52px;text-align:right;font-size:16px;font-weight:700;color:#14532D;font-variant-numeric:tabular-nums}
.hint{display:none;font-size:clamp(14px,1.3vw,18px);letter-spacing:.08em;color:#14532D;font-weight:500;opacity:.85;animation:hintPulse 2s ease-in-out infinite}
@keyframes hintPulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ---------- fullscreen button ---------- */
#fs{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:50;width:44px;height:44px;border-radius:12px;border:1px solid rgba(20,83,45,.35);background:rgba(255,255,255,.65);color:#14532D;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;opacity:.75;transition:opacity .15s}
#fs:hover,#fs:active{opacity:1}
#fs svg{width:22px;height:22px}
#fs .ico-out{display:none}
#fs.on .ico-in{display:none}
#fs.on .ico-out{display:block}

@media (prefers-reduced-motion: reduce){.scanline,.firefly,.shield .r1,.shield .r2{animation:none}}
</style>

      flocks.forEach(function (f) {
        var u = ((t - f.delay) * f.speed);
        if (u < 0) return;
        u = u % 1.25;                                   // pause off-screen between passes
        var fade = Math.min(1, t / 1.5);
        for (var i = 0; i < f.b.length; i++) {
          var b = f.b[i], ux = u - b.dx * .6;
          var x = (-0.12 + ux * 1.3) * W;
          var y = H * (f.y0 - .2 * ux + .035 * Math.sin(ux * 7 + b.ph * .3)) + b.dy * H + Math.sin(t * 1.6 + b.ph) * H * .006;
          if (x < -40 || x > W + 40) continue;
          var s = b.s * H * .03;
          cx.lineWidth = Math.max(1.4, s * .16);
          bird(x, y, s, Math.sin(t * b.f + b.ph), .8 * fade);
        }
      });
      cx.globalAlpha = 1;
      raf = requestAnimationFrame(frame);
    }
    return {
      start: function () { resize(); t0 = performance.now(); if (!raf) raf = requestAnimationFrame(frame); },
      resize: resize,
      stop: function () { if (raf) cancelAnimationFrame(raf); raf = 0; cx.clearRect(0, 0, W || 1, H || 1); }
    };
  })();
  window.addEventListener('resize', function () { Ribbons.resize(); Birds.resize(); });
  Ribbons.start('ambient');

  (function fireflies() {
    var box = $('fireflies');
    for (var i = 0; i < 16; i++) {
      var s = 4 + rnd(i + 80) * 4;
      box.appendChild(el('div', 'firefly',
        'left:' + (rnd(i + 5) * 96 + 2).toFixed(1) + '%;bottom:' + (rnd(i + 45) * 40).toFixed(1) + '%;width:' + s.toFixed(0) + 'px;height:' + s.toFixed(0) + 'px;' +
        'animation-duration:' + (7 + rnd(i + 125) * 6).toFixed(2) + 's;animation-delay:' + (rnd(i + 165) * 8).toFixed(2) + 's'));
    }
  })();

  function leaves(box, n, mode) {
    box.innerHTML = '';
    var colors = mode === 'rise' ? ['#22C55E', '#4ADE80', '#86EFAC', '#BEF264'] : ['#16A34A', '#22C55E', '#86EFAC', '#14532D', '#BEF264'];
    for (var i = 0; i < n; i++) {
      var size = mode === 'rise' ? 16 + rnd(i + 80) * 18 : 12 + rnd(i + 7) * 14;
      var st = 'width:' + size.toFixed(0) + 'px;height:' + (size * 0.9).toFixed(0) + 'px;background:' + colors[i % colors.length] + ';';
      if (mode === 'rise') {
        st += 'left:' + (rnd(i + 21) * 96 + 2).toFixed(1) + '%;bottom:' + (rnd(i + 61) * 10).toFixed(1) + '%;animation:dcRiseLeaf ' +
              (2.2 + rnd(i + 141) * 1).toFixed(2) + 's ' + (rnd(i + 181) * 1.4).toFixed(2) + 's ease-out both';
      } else {
        st += 'top:0;left:' + (rnd(i) * 100).toFixed(1) + '%;opacity:1;animation:dcFall ' +
              (3 + rnd(i + 99) * 2.4).toFixed(2) + 's ' + (rnd(i + 50) * 1.8).toFixed(2) + 's ease-in both';
      }
      box.appendChild(el('div', 'leaf', st));
    }
  }

  /* ---------- face detection ---------- */
  function ensureModel() {
    if (modelPromise) return modelPromise;
    modelPromise = (async function () {
      if (!window.faceapi) throw new Error('detector missing');
      try { await faceapi.tf.setBackend('webgl'); } catch (e) {}
      await faceapi.tf.ready();
      await faceapi.nets.tinyFaceDetector.loadFromUri('vendor/model');
      detectOpts = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.35 });
    })();
    modelPromise.catch(function () { modelPromise = null; });
    return modelPromise;
  }

  // Forgiving test: a face is "here" if its centre is anywhere inside the circle and it is not tiny.
  function inFrame(box) {
    if (!box) return false;
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return false;
    var side = Math.min(vw, vh), sx = (vw - side) / 2, sy = (vh - side) / 2;
    var cx = (box.x + box.width / 2 - sx) / side, cy = (box.y + box.height / 2 - sy) / side;
    var size = Math.max(box.width, box.height) / side;
    return Math.hypot(cx - 0.5, cy - 0.5) <= 0.5 && size >= CFG.minFace && size <= CFG.maxFace;
  }
  function present(now) { return manual || (now - lastSeen) < CFG.presentMs; }

  async function detectOnce() {
    if (detecting || !detectOpts || !video.videoWidth) return;
    if (stage !== 'position' && stage !== 'countdown' && stage !== 'scanning') return;
    detecting = true;
    try {
      var all = await faceapi.detectAllFaces(video, detectOpts);
      var faces = all.filter(function (r) { return inFrame(r.box); })
        .sort(function (a, b) { return b.box.width * b.box.height - a.box.width * a.box.height; });
      // only one person at a time: the nearest (largest) face counts, smaller faces behind are ignored,
      // but two similar-sized faces are ambiguous, so wait until just one person is in front
      var one = faces.length > 0 && (faces.length === 1 || faces[1].box.width * faces[1].box.height < 0.45 * faces[0].box.width * faces[0].box.height);
      onFace(one, Date.now());
    } catch (e) {
      onFace(false, Date.now());
    } finally {
      detecting = false;
    }
  }

  function onFace(ok, now) {
    faceOK = ok;
    if (ok) { lastSeen = now; lostSince = 0; if (!okSince) okSince = now; }
    else { okSince = 0; if (!lostSince) lostSince = now; }
    var here = present(now);
    if (here) { if (!hereSince) hereSince = now; } else hereSince = 0;
    scanner.classList.toggle('has', here);
    scanner.classList.toggle('paused', stage === 'scanning' && !here);

    if (stage === 'position' && here && now - hereSince >= CFG.holdMs) beginScan();
    else if (stage === 'scanning' && !here && lostSince && now - lostSince >= CFG.resetMs) beginPosition();
  }

  /* ---------- camera ---------- */
  async function ensureStream() {
    if (stream && stream.getTracks().some(function (t) { return t.readyState === 'live'; })) {
      if (video.srcObject !== stream) video.srcObject = stream;
    } else {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera api');
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
      video.srcObject = stream;
    }
    video.muted = true; video.setAttribute('playsinline', '');
    try { await video.play(); } catch (e) {}
  }
  function stopStream() {
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); }
    stream = null; video.srcObject = null;
  }

  /* ---------- flow ---------- */
  function deny(msg) { $('deniedNote').textContent = msg; setStage('denied'); }

  async function start() {
    if (stage !== 'idle' && stage !== 'denied') return;
    demo = false; app.setAttribute('data-demo', '0');
    setStage('starting');
    keepAwake();
    var s = ensureStream();          // called straight from the tap so iPad Safari allows it
    var m = ensureModel();
    try { await s; } catch (e) { deny('Camera access was blocked or no camera was found. Allow camera access in your browser settings, then try again.'); return; }
    try { await m; } catch (e) { deny('Face detection could not load. Check the connection, reload the page and try again.'); return; }
    beginPosition();
  }

  function startDemo() {
    clearAll(); stopStream();
    demo = true; app.setAttribute('data-demo', '1');
    beginPosition();
  }

  function beginPosition() {
    clearT('scan'); clearT('detect'); clearT('demoPos');
    progress = 0; $('scanPct').textContent = '0';
    okSince = 0; lostSince = Date.now(); faceOK = false; lastSeen = 0; hereSince = 0; manual = false;
    scanner.classList.remove('has', 'paused');
    setStage('position');
    if (demo) {
      timers.demoPos = setTimeout(function () { scanner.classList.add('has'); faceOK = true; timers.demoPos = setTimeout(beginScan, 700); }, 1800);
    } else {
      timers.detect = setInterval(detectOnce, CFG.detectEveryMs);
    }
  }

  
  function beginScan() {
    clearT('demoPos');
    progress = 0; $('scanPct').textContent = '0';
    setStage('scanning');
    var step = 100 / (CFG.scanMs / 60);
    timers.scan = setInterval(function () {
      if (!(demo || present(Date.now()))) return;                       // pause while the face is out of frame
      progress = Math.min(100, progress + step);
      $('scanPct').textContent = String(Math.round(progress));
      if (progress >= 100) granted();
    }, 60);
  }

  function granted() {
    clearT('scan'); clearT('detect');
    setStage('granted');
    timers.next = setTimeout(startEnergy, 1500);
  }

  function startEnergy() {
    setStage('energy');
    Ribbons.start('energy');
    timers.next = setTimeout(startReveal, 3600);
  }

  function startReveal() {
    $('again').style.display = 'none';
    $('launchNote').textContent = 'Preparing your experience…';
    $('launchFill').style.width = '0%'; $('launchPct').textContent = '0';
    var p = 0;
    setStage('reveal');
    Ribbons.start('reveal'); Birds.start();
    timers.launch = setInterval(function () {
      p = Math.min(100, p + 0.9);
      $('launchFill').style.width = p + '%';
      $('launchPct').textContent = String(Math.round(p));
      if (p >= 100) {
        clearT('launch');
        $('launchNote').textContent = 'Welcome aboard.';
        $('again').style.display = 'block';
      }
    }, 50);
  }

  function reset() {
    clearAll(); Ribbons.start('ambient'); Birds.stop();
    progress = 0; $('scanPct').textContent = '0'; demo = false; app.setAttribute('data-demo', '0');
    setStage('idle');
  }

  /* ---------- dot-matrix portrait ---------- */
  /* ---------- full screen ---------- */
  var fsBtn = $('fs'), root = document.documentElement;
  var fsEnabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  function inFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  if (fsEnabled && (root.requestFullscreen || root.webkitRequestFullscreen)) {
    fsBtn.style.display = 'flex';
    fsBtn.addEventListener('click', function () {
      if (inFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
      else { (root.requestFullscreen || root.webkitRequestFullscreen).call(root); }
    });
    var sync = function () { fsBtn.classList.toggle('on', inFs()); };
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
  }

  /* ---------- keep the screen awake ---------- */
  var wake = null;
  function keepAwake() {
    try { if (navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(function (w) { wake = w; w.addEventListener('release', function () { wake = null; }); }).catch(function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && stage !== 'idle') keepAwake(); });
  window.addEventListener('pagehide', stopStream);

  /* ---------- wire up ---------- */
  $('tap').addEventListener('click', start);
  $('retry').addEventListener('click', start);
  $('demoBtn').addEventListener('click', startDemo);
  function restartIfDone(e) {
    if (stage !== 'reveal' || $('again').style.display !== 'block') return;
    if (e && e.target && e.target.closest && e.target.closest('#fs')) return;
    reset();
  }
  document.addEventListener('click', restartIfDone);
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ') { if (stage === 'reveal') e.preventDefault(); restartIfDone(); }
  });

  // start loading the detector right away so the first scan is quick
  ensureModel().catch(function () {});
})();
</script>
</body>
</html>
